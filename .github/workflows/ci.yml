name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: TypeScript + isolated build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript gate
        run: npx tsc --noEmit
      - name: Build with explicit local empty-database fixture
        run: |
          node scripts/ci-database.cjs &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8765/rest/v1/health >/dev/null && break
            sleep 1
          done
          npm run build
        env:
          AIDAM_CI_FIXTURE: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8765
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-fixture-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-fixture-service
          SUPABASE_SERVICE_KEY: ci-fixture-service
          RESEND_API_KEY: re_ci_fixture_no_delivery
# This proves type safety and buildability, not production connectivity.
# Production data/ownership paths are verified independently against deployed sites.
